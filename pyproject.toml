[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vp-platform"
version = "0.1.0"
description = "Volume Profile + Delta platform pentru NQ/MNQ (date Databento)"
requires-python = ">=3.10"

[tool.setuptools]
packages = ["core", "data", "app", "app.desktop"]

[tool.pytest.ini_options]
testpaths = ["tests"]
